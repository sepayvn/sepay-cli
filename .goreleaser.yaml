version: 2

project_name: sepay

before:
  hooks:
    # No `go mod tidy` here: a release must not edit go.mod / go.sum while it builds.
    # CI checks tidiness instead.
    - make completions

builds:
  - id: sepay
    main: ./cmd/sepay
    binary: sepay
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Keep the build machine's paths out of the shipped binary.
    flags: [-trimpath]
    # Stamp from the commit, not the build clock, so the same commit rebuilds to
    # the same checksum on linux and windows. Signed darwin binaries embed Apple's
    # timestamp (see `notarize`), so their archives do not.
    mod_timestamp: "{{ .CommitTimestamp }}"
    # Inject build info — same variables as the Makefile / internal/build.
    ldflags:
      - -s -w
      - -X github.com/sepayvn/sepay-cli/internal/build.Version={{ .Version }}
      - -X github.com/sepayvn/sepay-cli/internal/build.Commit={{ .ShortCommit }}
      - -X github.com/sepayvn/sepay-cli/internal/build.Date={{ .CommitDate }}

# Developer ID signing + Apple notarization of the darwin binaries (quill, runs on Linux).
# Runs after the build and before the archives, so checksums.txt, the cosign signature and
# the npm packages all carry the signed binaries. Without the secrets (ci.yml snapshot, a fork,
# a local run) it is skipped and the build is unchanged; release.yml then warns and ships
# them unsigned. A signed darwin binary embeds Apple's timestamp, so the darwin archives no
# longer rebuild to the same checksum; linux and windows still do.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [sepay]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: sepay
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    # File mtimes land in the archive hash, and mtime is each machine's checkout /
    # generation time. Unpinned, two machines building the same commit produce
    # archives with different hashes, and checksums.txt would not match a rebuild.
    files:
      - src: LICENSE
        info: { mtime: "{{ .CommitDate }}" }
      - src: README*.md
        info: { mtime: "{{ .CommitDate }}" }
      - src: completions/*
        dst: completions
        info: { mtime: "{{ .CommitDate }}" }

# One SPDX SBOM per archive (syft, installed by the workflow), listed in checksums.txt like the
# archives, so the signature and the provenance cover it too.
sboms:
  - artifacts: archive

checksum:
  name_template: checksums.txt
  # Listed so `sha256sum -c checksums.txt` covers the install scripts attached to the release.
  extra_files:
    - glob: ./scripts/install.sh
      name_template: sepay-cli-install.sh
    - glob: ./scripts/install.ps1
      name_template: sepay-cli-install.ps1

# Keyless signing via cosign (GitHub OIDC) — no stored private key.
# Signs the checksums file, which covers every artifact.
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

release:
  github:
    owner: sepayvn
    name: sepay-cli
  # release-please creates the GitHub Release (title + notes from CHANGELOG.md); GoReleaser
  # attaches the files and appends the footer below to those notes. A -rc tag pushed by hand
  # has no release yet, so GoReleaser creates it with the footer alone. Rerunning this job
  # appends the footer a second time: delete the copy by hand on the release page.
  mode: append
  draft: false
  # Without this a -rc tag becomes GitHub's "latest" release.
  prerelease: auto
  # The install scripts of this release, at releases/download/<tag>/sepay-cli-install.{sh,ps1}
  # (and releases/latest/download/… for the newest final release, where the
  # get.sepay.vn/sepay-cli-install.{sh,ps1} redirects point).
  extra_files:
    - glob: ./scripts/install.sh
      name_template: sepay-cli-install.sh
    - glob: ./scripts/install.ps1
      name_template: sepay-cli-install.ps1
  footer: |
    ## Install

    ```sh
    npm install -g sepay-cli@{{ .Version }}
    curl -fsSL https://github.com/sepayvn/sepay-cli/releases/download/{{ .Tag }}/sepay-cli-install.sh | sh -s -- --version {{ .Version }}
    ```

    ```powershell
    $env:SEPAY_VERSION = '{{ .Version }}'; irm https://github.com/sepayvn/sepay-cli/releases/download/{{ .Tag }}/sepay-cli-install.ps1 | iex
    ```

    ## Verify

    ```sh
    # Signature over checksums.txt (keyless, this repository's release workflow)
    cosign verify-blob checksums.txt \
      --signature checksums.txt.sig --certificate checksums.txt.pem \
      --certificate-identity-regexp '^https://github\.com/sepayvn/sepay-cli/\.github/workflows/release\.yml@refs/(heads/main|tags/v.*)$' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    # The files you downloaded against checksums.txt
    sha256sum -c --ignore-missing checksums.txt
    {{- if ne (envOrDefault "REPO_PRIVATE" "false") "true" }}
    # Build provenance of one file
    gh attestation verify sepay_{{ .Version }}_linux_amd64.tar.gz -R sepayvn/sepay-cli
    {{- end }}
    ```

# Homebrew tap and Scoop bucket, pushed by every final release from a public repository.
# TAP_GITHUB_TOKEN is a GitHub App token for those two repositories only (GITHUB_TOKEN cannot write
# there); release.yml mints it for exactly those releases, so without it nothing is pushed. A
# private repository gets no token: its downloads would 404 from the cask and manifest.
# `auto` still leaves a prerelease out, and a snapshot build (ci.yml npm-package, a local run) never pushes.
homebrew_casks:
  - name: sepay
    ids: [sepay]
    repository:
      owner: sepayvn
      name: homebrew-sepay-cli
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/sepayvn/sepay-cli
    description: SePay command line interface
    license: Apache-2.0
    commit_author:
      name: sepay-cli-releaser[bot]
      email: sepay-cli-releaser[bot]@users.noreply.github.com
      use_github_app_token: true
    commit_msg_template: "chore: sepay {{ .Tag }}"
    skip_upload: '{{ if eq (envOrDefault "TAP_GITHUB_TOKEN" "") "" }}true{{ else }}auto{{ end }}'
    completions:
      bash: completions/sepay.bash
      zsh: completions/_sepay
      fish: completions/sepay.fish
    # A signed and notarized binary (see `notarize`) passes Gatekeeper as installed. Only a
    # build made without the signing secrets clears quarantine, or macOS refuses to run it.
    hooks:
      post:
        install_steps: |
          {{- if not (isEnvSet "MACOS_SIGN_P12") }}
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/sepay"]
          end
          {{- end }}

scoops:
  - name: sepay
    ids: [sepay]
    repository:
      owner: sepayvn
      name: scoop-sepay-cli
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/sepayvn/sepay-cli
    description: SePay command line interface
    license: Apache-2.0
    commit_author:
      name: sepay-cli-releaser[bot]
      email: sepay-cli-releaser[bot]@users.noreply.github.com
      use_github_app_token: true
    commit_msg_template: "chore: sepay {{ .Tag }}"
    skip_upload: '{{ if eq (envOrDefault "TAP_GITHUB_TOKEN" "") "" }}true{{ else }}auto{{ end }}'

# Release notes come from release-please (CHANGELOG.md), not from GoReleaser.
changelog:
  disable: true
