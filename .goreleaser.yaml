version: 2

project_name: sepay

before:
  hooks:
    # No `go mod tidy` here: a release must not edit go.mod / go.sum while it builds.
    # CI checks tidiness instead.
    - make completions

builds:
  - id: sepay
    main: ./cmd/sepay
    binary: sepay
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Keep the build machine's paths out of the shipped binary.
    flags: [-trimpath]
    # Stamp from the commit, not the build clock, so the same commit rebuilds to
    # the same checksum.
    mod_timestamp: "{{ .CommitTimestamp }}"
    # Inject build info — same variables as the Makefile / internal/build.
    ldflags:
      - -s -w
      - -X github.com/sepayvn/sepay-cli/internal/build.Version={{ .Version }}
      - -X github.com/sepayvn/sepay-cli/internal/build.Commit={{ .ShortCommit }}
      - -X github.com/sepayvn/sepay-cli/internal/build.Date={{ .CommitDate }}

archives:
  - id: sepay
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    # File mtimes land in the archive hash, and mtime is each machine's checkout /
    # generation time. Unpinned, two machines building the same commit produce
    # archives with different hashes, and checksums.txt would not match a rebuild.
    files:
      - src: LICENSE
        info: { mtime: "{{ .CommitDate }}" }
      - src: README.md
        info: { mtime: "{{ .CommitDate }}" }
      - src: completions/*
        dst: completions
        info: { mtime: "{{ .CommitDate }}" }


checksum:
  name_template: checksums.txt

# Keyless signing via cosign (GitHub OIDC) — no stored private key.
# Signs the checksums file, which covers every artifact.
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

release:
  github:
    owner: sepayvn
    name: sepay-cli
  # release-please creates the GitHub Release (title + notes from CHANGELOG.md);
  # GoReleaser only attaches the archives and the signed checksums to it. A -rc tag
  # pushed by hand has no release yet, so GoReleaser creates that one.
  mode: keep-existing
  draft: false
  # Without this a -rc tag becomes GitHub's "latest" release.
  prerelease: auto

# Homebrew tap and Scoop bucket. Nothing is pushed until PUBLISH_TAPS is "true" (release.yml sets it
# from the repository variable, after the repository is public); a prerelease is never pushed.
# TAP_GITHUB_TOKEN is a GitHub App token for those two repositories only: GITHUB_TOKEN cannot write there.
homebrew_casks:
  - name: sepay
    ids: [sepay]
    repository:
      owner: sepayvn
      name: homebrew-sepay-cli
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/sepayvn/sepay-cli
    description: SePay command line interface
    license: Apache-2.0
    commit_author:
      name: sepay-cli-releaser[bot]
      email: sepay-cli-releaser[bot]@users.noreply.github.com
      use_github_app_token: true
    commit_msg_template: "chore: sepay {{ .Tag }}"
    skip_upload: '{{ if eq .Env.PUBLISH_TAPS "true" }}auto{{ else }}true{{ end }}'
    completions:
      bash: completions/sepay.bash
      zsh: completions/_sepay
      fish: completions/sepay.fish
    # The binary is not signed or notarized by Apple: without this, macOS refuses to run it.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/sepay"]
          end

scoops:
  - name: sepay
    ids: [sepay]
    repository:
      owner: sepayvn
      name: scoop-sepay-cli
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/sepayvn/sepay-cli
    description: SePay command line interface
    license: Apache-2.0
    commit_author:
      name: sepay-cli-releaser[bot]
      email: sepay-cli-releaser[bot]@users.noreply.github.com
      use_github_app_token: true
    commit_msg_template: "chore: sepay {{ .Tag }}"
    skip_upload: '{{ if eq .Env.PUBLISH_TAPS "true" }}auto{{ else }}true{{ end }}'

# Release notes come from release-please (CHANGELOG.md), not from GoReleaser.
changelog:
  disable: true
