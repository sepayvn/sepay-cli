name: Scorecard

# OpenSSF Scorecard: branch protection, pinned actions, token permissions and the other
# supply-chain checks, published for the README badge and shown under Security > Code scanning.
on:
  push:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"

permissions: {}

jobs:
  analysis:
    # Publishing and code scanning both need a public repository.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish the results to the OpenSSF API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
